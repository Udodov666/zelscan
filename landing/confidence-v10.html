<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Вердикт нейросети — 12 объёмных вариантов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#020202;--cardbg:rgba(15,15,15,.5);--hd:#090909;--txt:#EBEBEB;--mut:#6B6B6B;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',system-ui,-apple-system,sans-serif}
body{background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
.page{width:1080px;margin:0 auto;padding:40px 0 180px}

.topbar{display:flex;align-items:flex-end;justify-content:space-between;padding:0 20px 10px;gap:40px}
.topbar h1{font-size:20px;font-weight:600;letter-spacing:-.03em}
.topbar p{font-size:13px;color:var(--mut);margin-top:8px;line-height:1.6;max-width:760px}
.btn{border:0;cursor:pointer;background:rgba(255,255,255,.07);color:#EBEBEB;font-size:13px;font-weight:500;padding:10px 16px;border-radius:100px;white-space:nowrap;transition:background .25s ease}
.btn:hover{background:rgba(255,255,255,.14)}

.series{padding:0 20px;margin:104px 0 -20px}
.series h2{font-size:15px;font-weight:600;letter-spacing:-.01em}
.series p{font-size:12.5px;color:#565656;margin-top:7px;line-height:1.65;max-width:780px}

.variant{margin-top:60px}
.vlabel{display:flex;align-items:center;gap:10px;padding:0 20px 12px}
.vnum{font-size:11px;font-weight:700;color:#020202;background:#EBEBEB;border-radius:100px;padding:3px 8px}
.vlabel b{font-size:14px;font-weight:600;letter-spacing:-.01em}
.vlabel i{font-style:normal;font-size:12px;color:#5A5A5A}
.hdr{background:var(--hd);border-radius:28px 28px 0 0;height:42px;display:flex;align-items:center;padding:0 24px;margin:0 20px;font-size:13px;color:rgba(168,168,168,.51)}
.card{position:relative;overflow:hidden;background:var(--cardbg);border-radius:28px;min-height:404px;display:flex;flex-direction:column;padding:32px}
.gfx{position:absolute;inset:0;z-index:0;overflow:hidden;border-radius:28px;pointer-events:none}
.bd{position:relative;z-index:3;display:flex;flex-direction:column;flex:1;max-width:600px}
.sp{flex:1;min-height:80px}
.traits{display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:100px;background:rgba(255,255,255,.06);font-size:13px;font-weight:500;letter-spacing:.1px;color:rgba(255,255,255,.9);white-space:nowrap}
.verdict{font-size:44px;font-weight:500;letter-spacing:-.04em;line-height:1.05;color:#EBEBEB}
.sub{font-size:13px;color:#6B6B6B;margin-top:14px;line-height:1.6}
.legend{position:absolute;top:26px;right:28px;z-index:4;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.legend div{display:flex;align-items:center;gap:7px;font-size:11px;color:#6B6B6B}
.legend em{width:6px;height:6px;border-radius:50%;font-style:normal;display:block}
.tip{position:absolute;z-index:9;pointer-events:none;background:rgba(18,18,18,.94);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:7px 10px;font-size:12px;opacity:0;transition:opacity .18s ease;transform:translate(-50%,-155%);white-space:nowrap}
.tip s{text-decoration:none;color:#7A7A7A;margin-left:8px}
svg text{font-family:'Inter',sans-serif}

.gr{position:absolute}
.gr.right{right:44px;bottom:0;width:300px;height:340px}
.gr.wideR{right:18px;top:50%;transform:translateY(-50%);width:380px;height:344px}
.gr.tube{right:26px;top:50%;transform:translateY(-50%);width:340px;height:344px}
.gr.strip{left:0;bottom:0;width:1080px;height:170px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.gr.vfade{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 12%,#000 88%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 12%,#000 88%,transparent 100%)}

.vb5 .card{min-height:340px;padding-bottom:176px}
.vb5 .bd{max-width:100%}

.tubeglass{position:absolute;left:82px;top:12px;width:176px;height:320px;border-radius:120px;z-index:2;overflow:hidden;
  backdrop-filter:blur(2.6px) saturate(140%);-webkit-backdrop-filter:blur(2.6px) saturate(140%);
  background:linear-gradient(102deg,rgba(255,255,255,.055),rgba(255,255,255,.012) 34%,rgba(0,0,0,.12) 68%,rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.07);
  box-shadow:inset 0 0 46px rgba(0,0,0,.55),inset 20px 0 34px -28px rgba(255,255,255,.55),inset -20px 0 34px -28px rgba(255,255,255,.35)}
.tubeglass i{position:absolute;top:-20%;left:-40%;width:26%;height:140%;transform:rotate(11deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);animation:tshine 9s ease-in-out infinite}
@keyframes tshine{0%{left:-40%}60%,100%{left:130%}}
</style>
</head>
<body>
<div class="page" id="page"></div>

<script>
(function(){
'use strict';

/* ===================== 1. ДАННЫЕ ===================== */

var AXES = {
	'Упёртость':     {c:'#F59E0B'},
	'Конфликтность': {c:'#EF4444'},
	'Саморегуляция': {c:'#22D3EE'},
	'Эмпатия':       {c:'#34D399'},
	'Эго':           {c:'#A78BFA'},
	'Уверенность':   {c:'#D5DE58'}
};

var data = {
	traits:  ['открытый','дружелюбный','уступчивый','сдержанный'],
	verdict: 'Тихий манипулятор',
	sub:     'Мягок в словах, но твёрд в решениях — умеет настоять на своём.',
	axes:    {'Упёртость':7.4,'Конфликтность':3.2,'Саморегуляция':8.1,'Эмпатия':6.6,'Эго':5.9,'Уверенность':7.2},
	words:   [{w:'думаю',n:42},{w:'люди',n:38},{w:'просто',n:35},{w:'работа',n:31},{w:'время',n:29},{w:'хочу',n:27},{w:'спокойно',n:25},{w:'важно',n:23},{w:'проект',n:21},{w:'команда',n:20},{w:'надо',n:19},{w:'жизнь',n:18},{w:'смысл',n:17},{w:'деньги',n:16},{w:'друзья',n:15},{w:'сложно',n:14},{w:'решение',n:13},{w:'честно',n:13},{w:'помочь',n:12},{w:'может',n:12},{w:'вообще',n:11},{w:'нормально',n:11},{w:'цель',n:10},{w:'ошибка',n:10},{w:'контроль',n:9},{w:'семья',n:9},{w:'учиться',n:8},{w:'сила',n:8},{w:'страх',n:7},{w:'выбор',n:7},{w:'дом',n:6},{w:'слова',n:6},{w:'риск',n:5},{w:'опыт',n:5},{w:'ночь',n:4},{w:'сам',n:4}]
};
window.data = data;

var PRESETS = [
	{v:'Тихий манипулятор', s:'Мягок в словах, но твёрд в решениях — умеет настоять на своём.', t:['открытый','дружелюбный','уступчивый','сдержанный']},
	{v:'Упрямый стратег', s:'Долго молчит, а потом ставит перед фактом — и почти всегда оказывается прав.', t:['расчётливый','терпеливый','закрытый','упорный']},
	{v:'Тёплый провокатор', s:'Задевает по-доброму: спорит, чтобы сблизиться, а не чтобы победить.', t:['эмоциональный','прямой','лёгкий','ироничный']},
	{v:'Наблюдатель на дистанции', s:'Видит больше, чем говорит, и почти никогда не вступает в чужие конфликты.', t:['вдумчивый','отстранённый','аккуратный','независимый']},
	{v:'Заботливый контролёр', s:'Помогает искренне — но по своему сценарию и в свои сроки.', t:['ответственный','внимательный','настойчивый','тревожный']}
];

/* ===================== 2. ХЕЛПЕРЫ ===================== */

var page = document.getElementById('page');
var HEADTEXT = 'Сделано с помощью ИИ';

function AX(k){ return data.axes[k] != null ? data.axes[k] : 5; }
function CLR(k){ return (AXES[k] || {c:'#34D399'}).c; }
function nrm(v){ return Math.max(0, Math.min(1, v / 10)); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function sstep(a,b,x){ var t=clamp((x-a)/((b-a)||1e-6),0,1); return t*t*(3-2*t); }
function axTop(n){ return Object.keys(data.axes).sort(function(a,b){ return data.axes[b]-data.axes[a]; }).slice(0,n); }
function hexRgb(h){ var n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function rgba(h,a){ var c=hexRgb(h); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function rgbs(r,g,b,a){ return 'rgba('+(r|0)+','+(g|0)+','+(b|0)+','+a+')'; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function seed(){ var s=9; for(var k in data.axes) s=(s*31+Math.round(data.axes[k]*10))>>>0; return s||7; }
function topWords(n){ return data.words.slice().sort(function(a,b){ return b.n-a.n; }).slice(0,n); }
function wScale(ws){ var mx=ws[0].n, mn=ws[ws.length-1].n; return function(v){ return Math.pow((v-mn)/((mx-mn)||1),0.75); }; }

/* единый rAF-цикл: считается только то, что видно на экране */
var ticks=[], started=false;
var io=new IntersectionObserver(function(es){
	es.forEach(function(e){ for(var i=0;i<ticks.length;i++) if(ticks[i].el===e.target) ticks[i].vis=e.isIntersecting; });
},{rootMargin:'200px'});
function anim(el,fn){
	var t={el:el,fn:fn,vis:false,t0:performance.now()};
	ticks.push(t); io.observe(el);
	if(!started){
		started=true;
		requestAnimationFrame(function loop(now){
			for(var i=0;i<ticks.length;i++) if(ticks[i].vis) ticks[i].fn((now-ticks[i].t0)/1000);
			requestAnimationFrame(loop);
		});
	}
}
function stopAll(){ ticks.forEach(function(t){ io.unobserve(t.el); }); ticks.length=0; }

/* общий каркас блока: шапка + теги + вердикт + подпись */
function shell(n,name,note,cls){
	var t=axTop(4);
	var sec=document.createElement('section');
	sec.className='variant '+cls;
	sec.innerHTML=
		'<div class="vlabel"><span class="vnum">вариант '+n+'</span><b>'+name+'</b><i>'+note+'</i></div>'+
		'<div class="hdr">'+HEADTEXT+'</div>'+
		'<div class="card"><div class="gfx"></div><div class="bd">'+
			'<div class="traits">'+data.traits.map(function(tr,i){
				return '<span class="tag" style="box-shadow:inset 0 -10px 10px -12px '+rgba(CLR(t[i%t.length]),.55)+'">'+tr+'</span>';
			}).join('')+'</div>'+
			'<div class="sp"></div>'+
			'<div class="verdict">'+data.verdict+'</div>'+
			'<div class="sub">'+data.sub+'</div>'+
		'</div></div>';
	page.appendChild(sec);
	return {sec:sec, card:sec.querySelector('.card'), gfx:sec.querySelector('.gfx'), bd:sec.querySelector('.bd')};
}
function seriesTitle(h,p){
	var d=document.createElement('div'); d.className='series';
	d.innerHTML='<h2>'+h+'</h2><p>'+p+'</p>'; page.appendChild(d);
}
function legend(card,names){
	var h='<div class="legend">';
	names.forEach(function(n){ h+='<div><em style="background:'+CLR(n)+'"></em>'+n+' <span style="color:#4A4A4A">'+AX(n).toFixed(1)+'</span></div>'; });
	card.insertAdjacentHTML('beforeend',h+'</div>');
}
function mkTip(card){
	var el=document.createElement('div'); el.className='tip'; card.appendChild(el);
	return {
		show:function(x,y,n,v){ el.innerHTML='<b>'+n+'</b><s>'+v.toFixed(1)+' / 10</s>'; el.style.left=x+'px'; el.style.top=y+'px'; el.style.opacity=1; },
		hide:function(){ el.style.opacity=0; }
	};
}
/* источник света: в покое медленно дышит, под курсором идёт за ним */
function mkLight(card,bx,by){
	var st={x:bx,y:by,tx:bx,ty:by,h:false};
	card.addEventListener('mousemove',function(e){
		var r=card.getBoundingClientRect(); st.h=true;
		st.tx=clamp(((e.clientX-r.left)/r.width-0.5)*1.8,-0.95,0.95);
		st.ty=clamp(((e.clientY-r.top)/r.height-0.5)*1.5,-0.9,0.9);
	});
	card.addEventListener('mouseleave',function(){ st.h=false; });
	st.step=function(t){
		var tx=st.h?st.tx:bx+Math.sin(t*0.17)*0.22, ty=st.h?st.ty:by+Math.cos(t*0.13)*0.13;
		st.x+=(tx-st.x)*0.05; st.y+=(ty-st.y)*0.05;
		var lz=0.92, l=Math.sqrt(st.x*st.x+st.y*st.y+lz*lz);
		return [st.x/l,st.y/l,lz/l];
	};
	return st;
}

/* ============ 3. ПОЛЕ ГЛУБИНЫ — общий движок серии A ============ */
/* Силуэт больше не плоский path, а сумма трёх эллипсоидов со сглаженным
   объединением. Из поля берём высоту, из высоты — нормали, из нормалей — свет. */

var BW=300, BH=340, DEPTH=null;

function sq(v){ return v*v; }
function smax(a,b,k){ var h=Math.max(k-Math.abs(a-b),0)/k; return Math.max(a,b)+h*h*k*0.25; }
function rawDepth(x,y){
	var z=0,t;
	t=1-sq((x-150)/47)-sq((y-98)/58);    if(t>0) z=54*Math.sqrt(t);             /* голова */
	t=1-sq((x-150)/23)-sq((y-162)/42);   if(t>0) z=smax(z,26*Math.sqrt(t),16);  /* шея */
	t=1-sq((x-150)/158)-sq((y-358)/172); if(t>0) z=smax(z,46*Math.sqrt(t),22);  /* плечи и грудь */
	return z;
}
function buildField(){
	if(DEPTH) return;
	DEPTH=new Float32Array(BW*BH);
	for(var y=0;y<BH;y++) for(var x=0;x<BW;x++) DEPTH[y*BW+x]=rawDepth(x+0.5,y+0.5);
}
function dAt(x,y){ x=x|0; y=y|0; if(x<0||y<0||x>=BW||y>=BH) return 0; return DEPTH[y*BW+x]; }
function inBody(x,y){ return dAt(x,y)>1.4; }
function normalAt(x,y){
	var gx=(dAt(x+2,y)-dAt(x-2,y))*0.25, gy=(dAt(x,y+2)-dAt(x,y-2))*0.25;
	var l=Math.sqrt(gx*gx+gy*gy+1);
	return [-gx/l,-gy/l,1/l];
}
function rowInfo(y){
	var w=0,z=0,d,dx;
	for(var x=0;x<BW;x++){ d=dAt(x,y); if(d>1.4){ dx=Math.abs(x-150); if(dx>w)w=dx; if(d>z)z=d; } }
	return {w:w,z:z};
}

/* тепловые зоны: каждая ось живёт в своём участке тела */
var ZONES=[
	{n:'Саморегуляция',x:150,y:74,r:62},
	{n:'Эго',x:150,y:114,r:40},
	{n:'Конфликтность',x:150,y:146,r:34},
	{n:'Уверенность',x:150,y:212,r:62},
	{n:'Эмпатия',x:116,y:272,r:86},
	{n:'Упёртость',x:196,y:300,r:84}
];
function heatAt(x,y){
	var r=0,g=0,b=0,h=0,best=null,bf=0,i,z,f,k,c;
	for(i=0;i<ZONES.length;i++){
		z=ZONES[i]; f=1-Math.hypot(x-z.x,y-z.y)/z.r;
		if(f<=0) continue;
		f=f*f; k=f*nrm(AX(z.n)); c=hexRgb(CLR(z.n));
		h+=k; r+=c[0]*k; g+=c[1]*k; b+=c[2]*k;
		if(f>bf){ bf=f; best=z.n; }
	}
	if(h<0.002) return {r:225,g:225,b:225,h:0,z:null};
	return {r:r/h,g:g/h,b:b/h,h:Math.min(1,h),z:best};
}
function zoneAt(mx,my){
	var best=null,bf=0,i,z,f;
	for(i=0;i<ZONES.length;i++){ z=ZONES[i]; f=1-Math.hypot(mx-z.x,my-z.y)/z.r; if(f>bf){ bf=f; best=z; } }
	return (best&&bf>0&&inBody(mx,my))?best:null;
}
/* общий ховер по зонам тела */
function zoneHover(card,cv,tip,set){
	card.addEventListener('mousemove',function(e){
		var rc=cv.getBoundingClientRect(), cr=card.getBoundingClientRect();
		var sx=BW/rc.width, sy=BH/rc.height;
		var z=zoneAt((e.clientX-rc.left)*sx,(e.clientY-rc.top)*sy);
		if(z){ set(z.n); tip.show(e.clientX-cr.left,e.clientY-cr.top,z.n,AX(z.n)); }
		else { set(null); tip.hide(); }
	});
	card.addEventListener('mouseleave',function(){ set(null); tip.hide(); });
}

/* marching squares — изолинии поля глубины */
function seg(x1,y1,x2,y2){ return 'M'+x1.toFixed(1)+','+y1.toFixed(1)+'L'+x2.toFixed(1)+','+y2.toFixed(1); }
function isoPath(lv,g){
	var d='',x,y;
	for(y=1;y<BH-g-1;y+=g){
		for(x=1;x<BW-g-1;x+=g){
			var a=dAt(x,y),b=dAt(x+g,y),c=dAt(x+g,y+g),e=dAt(x,y+g);
			var id=(a>lv?8:0)|(b>lv?4:0)|(c>lv?2:0)|(e>lv?1:0);
			if(id===0||id===15) continue;
			var Tx=x+g*clamp((lv-a)/((b-a)||1e-6),0,1), Ty=y;
			var Rx=x+g, Ry=y+g*clamp((lv-b)/((c-b)||1e-6),0,1);
			var Bx=x+g*clamp((lv-e)/((c-e)||1e-6),0,1), By=y+g;
			var Lx=x, Ly=y+g*clamp((lv-a)/((e-a)||1e-6),0,1);
			switch(id){
				case 1: case 14: d+=seg(Lx,Ly,Bx,By); break;
				case 2: case 13: d+=seg(Bx,By,Rx,Ry); break;
				case 3: case 12: d+=seg(Lx,Ly,Rx,Ry); break;
				case 4: case 11: d+=seg(Tx,Ty,Rx,Ry); break;
				case 6: case 9:  d+=seg(Tx,Ty,Bx,By); break;
				case 7: case 8:  d+=seg(Lx,Ly,Tx,Ty); break;
				case 5:  d+=seg(Lx,Ly,Tx,Ty)+seg(Bx,By,Rx,Ry); break;
				case 10: d+=seg(Tx,Ty,Rx,Ry)+seg(Lx,Ly,Bx,By); break;
			}
		}
	}
	return d;
}

/* ============ 4. ЭТАЛОН — текущий прод-блок 1-в-1 ============ */
function v0(){
	var sec=document.createElement('section');
	sec.className='variant v0';
	sec.innerHTML=
		'<div class="vlabel"><span class="vnum">эталон</span><b>Текущий блок</b><i>как на проде, без изменений</i></div>'+
		'<section id="verdict-block" style="display:flex;flex-direction:column">'+
			'<div style="background:#090909;border-radius:28px 28px 0 0;height:42px;display:flex;align-items:center;padding:0 24px;margin:0 20px">'+
				'<span style="font-size:13px;color:rgba(168,168,168,0.51)">'+HEADTEXT+'</span>'+
			'</div>'+
			'<div style="position:relative;overflow:hidden;background:rgba(15,15,15,0.5);border-radius:28px;min-height:280px;display:flex;flex-direction:column;padding:32px">'+
				'<div style="position:absolute;width:110%;height:240px;top:-120px;left:-5%;background:radial-gradient(ellipse 60% 60% at 50% 0%,rgba(52,211,153,0.55) 0%,transparent 100%);filter:blur(48px);pointer-events:none"></div>'+
				'<div style="position:relative;z-index:1;display:flex;flex-direction:column;flex:1">'+
					'<div style="display:flex;gap:8px;flex-wrap:wrap">'+data.traits.map(function(t){ return '<span class="tag">'+t+'</span>'; }).join('')+'</div>'+
					'<div style="flex:1;min-height:80px"></div>'+
					'<div style="font-size:44px;font-weight:500;letter-spacing:-.04em;line-height:1.05;color:#EBEBEB">'+data.verdict+'</div>'+
					'<div style="font-size:13px;color:#6B6B6B;margin-top:14px;line-height:1.6">'+data.sub+'</div>'+
				'</div>'+
			'</div>'+
		'</section>';
	page.appendChild(sec);
}

/* ============ 5. СЕРИЯ A — ОБЪЁМНАЯ ЛИЧНОСТЬ ============ */

function a6(){
	buildField();
	var s=shell(6,'Облако точек','лидар-скан с вращением и глубиной резкости','vb6');
	s.gfx.innerHTML='<div class="gr right"><canvas width="600" height="680" style="width:300px;height:340px"></canvas></div>';
	var cv=s.gfx.querySelector('canvas'), ctx=cv.getContext('2d'); ctx.scale(2,2);
	var rnd=mulberry32(seed()), P=[], N=2600, guard=0;
	var prt=[{cx:150,cy:98,rx:47,ry:58,rz:54},{cx:150,cy:162,rx:23,ry:42,rz:26},{cx:150,cy:358,rx:158,ry:172,rz:46}];
	function gs(){ var u=1-rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(6.283*rnd()); }
	function insideOther(k,x,y,z){
		for(var i=0;i<3;i++){ if(i===k) continue; var p=prt[i];
			if(sq((x-p.cx)/p.rx)+sq((y-p.cy)/p.ry)+sq(z/p.rz)<0.94) return true; }

var NS='http://www.w3.org/2000/svg';
function svgEl(tag,at){ var e=document.createElementNS(NS,tag),k; for(k in at) e.setAttribute(k,at[k]); return e; }
function helixPath(cx,amp,y0,y1,turns,ph,off,steps){
	var d='',i,u,y,a,x;
	for(i=0;i<=steps;i++){
		u=i/steps; y=y0+(y1-y0)*u; a=ph+u*turns*6.283+off; x=cx+amp*Math.sin(a);
		d+=(i?'L':'M')+x.toFixed(1)+','+y.toFixed(1);
	}
	return d;
}

/* B4. Нить с бусинами — слова как стеклянные шары на одной нити:

	var i=0;
	if(PRESETS.length>1){ do{ i=Math.floor(Math.random()*PRESETS.length); } while(i===lastPreset); }
	lastPreset=i;
	var p=PRESETS[i];

	Object.keys(data.axes).forEach(function(k){
		data.axes[k]=Math.round(clamp(data.axes[k]+(Math.random()*6-3),1.2,9.6)*10)/10;
	});
	data.words.forEach(function(w){ w.n=Math.max(2,Math.round(w.n*(0.55+Math.random()*0.9))); });
