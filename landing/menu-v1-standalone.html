<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zelscan — Вариант 01 · FA6 Solid / Inter 600</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{min-height:100vh;padding:40px 20px;background:#090a0b;color:#ebebeb;font-family:Inter,system-ui,sans-serif;display:grid;place-items:center}
        .num{font-variant-numeric:tabular-nums}
        .bbadge{display:inline-flex;align-items:center;justify-content:center;height:1.55em;min-width:1.55em;margin-left:.45em;padding:0 .3em;border-radius:.42em;background:rgba(94,224,168,.16);color:#5ee0a8;font-size:.58em;font-weight:600;line-height:1;vertical-align:.28em}

        .acc-menu{position:relative;width:274px;padding:11px;overflow:hidden;border-radius:24px;background:rgba(26,27,29,.65);box-shadow:0 18px 40px rgba(0,0,0,.36);backdrop-filter:blur(24px) saturate(120%);-webkit-backdrop-filter:blur(24px) saturate(120%)}

        .acc-menu-user{display:flex;align-items:center;gap:10px;padding:7px 8px 11px}
        .acc-menu-av{position:relative;display:grid;width:38px;height:38px;flex:none;place-items:center;overflow:hidden;border-radius:13px;background:linear-gradient(145deg,#67dbff 2%,#268df1 58%,#174a7c);box-shadow:inset 0 1px 0 rgba(255,255,255,.34);color:#fff;font-size:15px;font-weight:500}
        .acc-menu-av::after{position:absolute;top:-11px;right:-9px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.19);content:"";filter:blur(2px);pointer-events:none}
        .acc-menu-who{min-width:0;flex:1}
        .acc-menu-name{color:#f2f2f0;font-size:14.5px;font-weight:500;line-height:18px}
        .acc-menu-id{display:inline-flex;align-items:center;height:17px;margin-top:3px;padding:0 6px;border-radius:6px;background:linear-gradient(180deg,#b38a16,#8b6300);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);color:#ffda58;font-size:10px;font-weight:500;line-height:17px;letter-spacing:.01em}

        .bal{margin:6px 2px 10px}
        .bal-card{position:relative;isolation:isolate;overflow:hidden;padding:4px 14px;border-radius:16px;background:rgba(255,255,255,.045)}
        .bal-card::before{position:absolute;z-index:0;inset:-22px -14px -16px 32%;background:radial-gradient(circle at 78% 4%,rgba(255,255,255,.9) 0,rgba(255,255,255,.3) 10%,rgba(226,232,236,.1) 20%,transparent 56%);content:"";filter:blur(5px);mix-blend-mode:screen;pointer-events:none;transition:background .25s ease-out}
        .bal-card::after{position:absolute;z-index:1;top:0;right:12px;width:118px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),rgba(255,255,255,.35),transparent);box-shadow:0 0 11px rgba(255,255,255,.24);content:"";pointer-events:none;transition:background .25s ease-out,box-shadow .25s ease-out}
        .bal-card .sec{position:relative;z-index:2;display:flex;flex-direction:column;gap:5px;padding:8px 0}
        .bal-card .krow{display:flex;align-items:center;justify-content:space-between}
        .bal-card .k{color:#77787d;font:400 12px Inter,sans-serif;transition:color .2s ease-out}
        .bal-card .vline{position:relative;z-index:2;display:flex;align-items:center;gap:7px}
        .bal-card .v{color:#f4f4f3;font:500 18px Inter,sans-serif;transition:color .2s ease-out,opacity .18s ease-out,transform .18s ease-out}
        .bal-card .v .bbadge{font-size:.62em}
        .bal-card .v.inactive{color:rgba(255,255,255,.35);cursor:pointer}
        .bal-card .v.inactive:hover{color:rgba(255,255,255,.55)}
        .bal-card .v.inactive .bbadge{background:rgba(255,255,255,.07);color:rgba(255,255,255,.35)}
        .bal-card .sep{color:#4c4d52;font:400 14px Inter,sans-serif}
        .bal-card .swap{position:relative;z-index:2;display:grid;width:auto;height:auto;margin:-4px;padding:4px;flex:none;place-items:center;border:0;border-radius:50%;background:none;color:#c8c8cd;cursor:pointer;transition:transform .2s ease-out,color .15s}
        .bal-card .swap:hover{color:#fff;transform:rotate(180deg)}
        .bal-card .swap:active{transform:rotate(180deg) scale(.9)}
        .bal-card .swap svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:2.2}
        .bal-card .topup{display:flex;align-items:center;justify-content:center;width:100%;height:32px;margin-top:10px;gap:6px;border:0;border-radius:10px;background:#f5f5f7;color:#0a0a0a;cursor:pointer;font:500 12px Inter,sans-serif;transition:transform 160ms ease-out,background 160ms ease-out}
        .bal-card .topup:hover{background:#fff}
        .bal-card .topup:active{transform:scale(.97)}
        .bal-card .topup svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-linecap:round}
        .bal-card .topup svg circle{stroke-width:1.8}
        .bal-card .topup svg path{stroke-width:2.6}
        .bal-card.swapped{background:rgba(94,224,168,.08)}
        .bal-card.swapped::before{background:radial-gradient(circle at 82% 4%,rgba(60,255,127,.3) 0,rgba(48,236,111,.13) 12%,rgba(41,190,91,.05) 26%,transparent 56%)}
        .bal-card.swapped::after{background:linear-gradient(90deg,transparent,rgba(94,255,150,.2),rgba(120,255,170,.42),transparent);box-shadow:0 0 9px rgba(60,255,127,.24)}
        .bal-card.swapped .k{color:rgba(255,255,255,.35)}
        .bal-card.swapped .vline .v:first-child{color:#5ee0a8}

        .menu-list{display:grid;margin-top:4px}
        .menu-item{display:flex;width:100%;align-items:center;gap:6px;padding:4px 6px;border:0;border-radius:11px;background:transparent;color:#d0d1d4;cursor:pointer;text-align:left;text-decoration:none;transition:background 140ms ease,color 140ms ease;font:600 13.5px Inter,sans-serif;letter-spacing:-.015em}
        .menu-item:hover{background:rgba(255,255,255,.05);color:#fff}
        .menu-item .mi{display:grid;width:30px;height:30px;flex:none;place-items:center;color:#989a9e;transition:color 140ms ease}
        .menu-item:hover .mi{color:currentColor}
        .menu-item .mi i{font-size:15px}
        .menu-sep{height:1px;margin:8px;background:rgba(255,255,255,.055)}
        .menu-item.danger{color:#f06d72}
        .menu-item.danger .mi{color:currentColor}
        .menu-item.danger:hover{background:rgba(240,109,114,.07);color:#ff8186}
    </style>
</head>
<body>

<div class="acc-menu">
    <div class="acc-menu-user">
        <div class="acc-menu-av">U</div>
        <div class="acc-menu-who"><div class="acc-menu-name">Udodov</div><div class="acc-menu-id">#638074 ✦</div></div>
    </div>

    <div class="bal">
        <div class="bal-card" id="balCard">
            <div class="sec">
                <div class="krow">
                    <span class="k">Основной счёт</span>
                    <button class="swap" onclick="zsSwap(this)" title="Сменить счёт">
                        <svg viewBox="0 0 24 24"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>
                    </button>
                </div>
                <span class="vline">
                    <span class="v num">466 ₽</span>
                    <span class="sep">/</span>
                    <span class="v inactive num" onclick="zsSwap(this)">110<span class="bbadge">Б</span></span>
                </span>
                <button class="topup" id="topupBtn">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 8.5v7M8.5 12h7"/></svg>
                    <span>Пополнить</span>
                </button>
            </div>
        </div>
    </div>

    <div class="menu-list">
        <a class="menu-item"><span class="mi"><i class="fa-solid fa-folder-open"></i></span>Мои досье</a>
        <a class="menu-item"><span class="mi"><i class="fa-solid fa-gear"></i></span>Настройки</a>
        <a class="menu-item" href="https://t.me/udodov228" target="_blank" rel="noopener"><span class="mi"><i class="fa-solid fa-bullhorn"></i></span>Поддержка</a>
        <a class="menu-item"><span class="mi"><i class="fa-solid fa-receipt"></i></span>Транзакции</a>
        <div class="menu-sep"></div>
        <a class="menu-item danger"><span class="mi"><i class="fa-solid fa-arrow-right-from-bracket"></i></span>Выйти</a>
    </div>
</div>

<script>
function zsSwap(el){
    const card=document.getElementById('balCard');
    const k=card.querySelector('.k');
    const vs=card.querySelectorAll('.vline .v');
    const btn=document.getElementById('topupBtn');
    if(vs.length<2)return;
    const a=vs[0],b=vs[1];
    const t=a.innerHTML;a.innerHTML=b.innerHTML;b.innerHTML=t;
    a.classList.remove('inactive');a.removeAttribute('onclick');
    b.classList.add('inactive');b.setAttribute('onclick','zsSwap(this)');
    k.textContent=(k.textContent.trim()==='Основной счёт')?'Бонусный счёт':'Основной счёт';
    if(btn){const s=btn.querySelector('span');if(s)s.textContent=(s.textContent.trim()==='Пополнить')?'Ввести промокод':'Пополнить';}
    card.classList.toggle('swapped');
}
</script>
</body>
</html>
