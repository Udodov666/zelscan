<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>V8 · Cross Rays — Neon Edge</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    />
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #090a0b;
            color: #ebebeb;
            font-family: Inter, system-ui, sans-serif;
        }

        .num {
            font-variant-numeric: tabular-nums;
        }

        .bbadge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 1.55em;
            min-width: 1.55em;
            margin-left: 0.45em;
            padding: 0 0.3em;
            border-radius: 0.42em;
            background: rgba(94, 224, 168, 0.17);
            color: #70efb8;
            font-size: 0.58em;
            font-weight: 600;
            line-height: 1;
            vertical-align: 0.28em;
        }

        .acc-menu {
            position: relative;
            width: 274px;
            padding: 11px;
            overflow: hidden;
            border-radius: 24px;
            background: rgba(26, 27, 29, 0.68);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.36);
            backdrop-filter: blur(24px) saturate(120%);
            -webkit-backdrop-filter: blur(24px) saturate(120%);
        }

        .acc-menu-user {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 8px 11px;
        }

        .acc-menu-av {
            position: relative;
            display: grid;
            width: 38px;
            height: 38px;
            flex: none;
            place-items: center;
            overflow: hidden;
            border-radius: 13px;
            background: linear-gradient(145deg, #67dbff 2%, #268df1 58%, #174a7c);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.34);
            color: #fff;
            font-size: 15px;
            font-weight: 500;
        }

        .acc-menu-av::after {
            position: absolute;
            top: -11px;
            right: -9px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.19);
            content: "";
            filter: blur(2px);
            pointer-events: none;
        }

        .acc-menu-who {
            min-width: 0;
            flex: 1;
        }

        .acc-menu-name {
            color: #f2f2f0;
            font-size: 14.5px;
            font-weight: 500;
            line-height: 18px;
        }

        .acc-menu-id {
            display: inline-flex;
            align-items: center;
            height: 17px;
            margin-top: 3px;
            padding: 0 6px;
            border-radius: 6px;
            background: linear-gradient(180deg, #b38a16, #8b6300);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
            color: #ffda58;
            font-size: 10px;
            font-weight: 500;
            line-height: 17px;
            letter-spacing: 0.01em;
        }

        .bal {
            margin: 6px 2px 10px;
        }

        /* ========================================== */
        /* ===== БАЗОВАЯ КАРТОЧКА (ОБЩАЯ) ===== */
        /* ========================================== */
        .bal-card {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            padding: 4px 16px;
            border: 0;
            border-radius: 20px;
            background:
                linear-gradient(
                    180deg,
                    #34d399 0%,
                    #087b5b 54%,
                    #05251e 100%
                );
            box-shadow:
                inset 0 1px 0 rgba(209, 250, 229, 0.3),
                inset 0 -26px 40px rgba(0, 0, 0, 0.23),
                inset 0 0 28px rgba(255, 255, 255, 0.035),
                0 11px 28px rgba(0, 0, 0, 0.24);
        }

        .bal-card::before {
            position: absolute;
            z-index: 1;
            inset: 0;
            background:
                radial-gradient(circle at 8% 24%, rgba(255,255,255,.48) 0 1px, transparent 1.35px),
                radial-gradient(circle at 27% 76%, rgba(255,255,255,.26) 0 .8px, transparent 1.2px),
                radial-gradient(circle at 53% 38%, rgba(255,255,255,.34) 0 .8px, transparent 1.2px),
                radial-gradient(circle at 79% 68%, rgba(255,255,255,.24) 0 .8px, transparent 1.2px),
                radial-gradient(circle at 93% 21%, rgba(255,255,255,.38) 0 .8px, transparent 1.2px);
            content: "";
            opacity: 0.44;
            pointer-events: none;
        }

        .bal-card::after {
            position: absolute;
            z-index: 1;
            top: -1px;
            left: 8%;
            width: 84%;
            height: 2px;
            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(167, 243, 208, 0.9) 20%,
                    rgba(255, 255, 255, 0.95) 50%,
                    rgba(167, 243, 208, 0.9) 80%,
                    transparent
                );
            box-shadow:
                0 0 12px rgba(52, 211, 153, 0.7),
                0 0 30px rgba(52, 211, 153, 0.4),
                0 0 60px rgba(52, 211, 153, 0.2);
            content: "";
            pointer-events: none;
            border-radius: 50%;
            filter: blur(1px);
            animation: topGlow 3s ease-in-out infinite;
        }

        @keyframes topGlow {
            0%, 100% { 
                opacity: 0.7;
                box-shadow: 0 0 10px rgba(52, 211, 153, 0.5), 0 0 25px rgba(52, 211, 153, 0.3);
            }
            50% { 
                opacity: 1;
                box-shadow: 0 0 18px rgba(52, 211, 153, 0.9), 0 0 35px rgba(52, 211, 153, 0.6);
            }
        }

        @keyframes glowPulse {
            0%, 100% { 
                opacity: 0.85;
                filter: blur(7px) saturate(1.4) brightness(1.1);
            }
            50% { 
                opacity: 1;
                filter: blur(8px) saturate(1.6) brightness(1.2);
            }
        }

        .bal-rays {
            position: absolute;
            z-index: 0;
            top: -120px;
            right: -46px;
            left: -46px;
            height: 168px;
            pointer-events: none;
            filter: blur(7px) saturate(1.4) brightness(1.1);
            transform: scale(1.1);
            transform-origin: 50% 0;
            opacity: 0.85;
            animation: glowPulse 3.5s ease-in-out infinite 0.7s;
        }

        .bal-rays::before {
            position: absolute;
            inset: -12px 10% 24px;
            border-radius: 50%;
            background:
                radial-gradient(
                    ellipse at 50% 0,
                    rgba(255, 255, 255, 0.3),
                    transparent 62%
                );
            content: "";
            filter: blur(7px);
            opacity: 0.9;
        }

        .bal-rays::after {
            position: absolute;
            inset: 0;
            content: "";
            opacity: 0.6;
            filter: blur(4px);
        }

        .bal-card .bal-rays {
            background:
                linear-gradient(65deg, transparent 0 45%, rgba(52, 211, 153, 0.3) 48%, rgba(110, 231, 183, 0.7) 58%, transparent 72%),
                linear-gradient(115deg, transparent 0 50%, rgba(0, 67, 48, 0.3) 55%, rgba(167, 243, 208, 0.8) 65%, rgba(220, 252, 231, 0.9) 76%, transparent 90%),
                radial-gradient(ellipse at 80% 0%, rgba(220, 252, 231, 0.85), transparent 35%);
        }

        /* ========================================== */
        /* ===== ПАРЯЩИЕ БЕЛЫЕ ЗВЁЗДЫ ===== */
        /* ========================================== */
        .stars-container {
            position: absolute;
            z-index: 2;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            border-radius: 20px;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            background: #ffffff; 
            animation: floatDown var(--duration, 6s) ease-in-out infinite alternate;
            animation-delay: var(--delay, 0s);
        }

        .star.size-1 { width: 1px; height: 1px; }
        .star.size-05 { width: 0.7px; height: 0.7px; }

        @keyframes floatDown {
            0% { 
                opacity: 0;
                transform: translate(0px, 0px) scale(0.2);
            }
            15% {
                opacity: calc(var(--base-opacity, 0.9) * 0.2);
                transform: translate(0px, 5px) scale(0.5);
            }
            50% {
                opacity: var(--base-opacity, 0.9);
                transform: translate(var(--drift-x, -4px), calc(var(--fall-y, 18px) * 0.5)) scale(1.1);
            }
            100% { 
                opacity: calc(var(--base-opacity, 0.9) * 0.1);
                transform: translate(var(--drift-x, -4px), var(--fall-y, 18px)) scale(0.6);
            }
        }

        /* ========================================== */
        /* ===== 4 ВАРИАНТА СВЕЧЕНИЯ (GLOW) ===== */
        /* ========================================== */
        
        /* Общий слой для свечения */
        .bal-card .glow-layer {
            position: absolute;
            z-index: 0;
            inset: 0;
            pointer-events: none;
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* --- Variant 1: Soft Glow (Мягкое свечение снизу) --- */
        .bal-card.variant-1 .glow-layer {
            opacity: 1;
            background: radial-gradient(ellipse at 50% 100%, rgba(52, 211, 153, 0.5) 0%, transparent 70%);
            filter: blur(25px);
            transform: translateY(15px);
        }

        /* --- Variant 2: Emerald Mist (Изумрудный туман) --- */
        .bal-card.variant-2 .glow-layer {
            opacity: 1;
            background: 
                radial-gradient(ellipse at 50% 100%, rgba(16, 185, 129, 0.6) 0%, transparent 50%),
                radial-gradient(ellipse at 20% 100%, rgba(52, 211, 153, 0.3) 0%, transparent 40%),
                radial-gradient(ellipse at 80% 100%, rgba(52, 211, 153, 0.3) 0%, transparent 40%);
            filter: blur(35px);
            transform: translateY(10px) scale(1.1);
        }

        /* --- Variant 3: Core Glow (Интенсивное свечение от центра) --- */
        .bal-card.variant-3 .glow-layer {
            opacity: 1;
            background: 
                radial-gradient(ellipse at 50% 60%, rgba(52, 211, 153, 0.7) 0%, rgba(16, 185, 129, 0.4) 40%, transparent 70%);
            filter: blur(40px);
            transform: scale(1.2);
        }

        /* --- Variant 4: Neon Edge (Неоновый контур снизу) --- */
        .bal-card.variant-4 .glow-layer {
            opacity: 1;
            background: 
                radial-gradient(ellipse at 50% 100%, rgba(52, 211, 153, 0.8) 0%, transparent 30%);
            filter: blur(15px);
            transform: translateY(5px);
            /* Дополнительная полоска по нижнему краю */
            box-shadow: 0 15px 30px -10px rgba(52, 211, 153, 0.4);
        }

        /* ========================================== */
        /* ===== ОБЩИЕ СТИЛИ ИНТЕРФЕЙСА ===== */
        /* ========================================== */
        .bal-card .sec {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            padding: 8px 0;
        }

        .bal-card .krow {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .bal-card .k {
            /* ПРАВКА: цвет белый, жирность 400 */
            color: rgb(255 255 255);
            font-size: 12px;
            font-weight: 400;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.22);
            margin-top: 4px;
        }

        .account-switch {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px;
            border-radius: 999px;
            background: rgb(0 0 0 / 8%);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        .account-btn {
            /* ПРАВКА: 21px */
            display: grid;
            width: 21px;
            height: 21px;
            flex: none;
            place-items: center;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            line-height: 1;
            transition: all 180ms ease;
        }

        .account-btn:hover {
            color: #ffffff;
        }

        .account-btn:active {
            transform: scale(0.92);
        }

        .account-btn.active {
            background: #ffffff;
            color: #090a0b;
            box-shadow: none;
        }

        .balance-row {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 0;
            margin-bottom: 0;
        }

        .bal-card .v {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            line-height: 24px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.22);
        }

        .bal-card .v .bbadge {
            font-size: 0.62em;
        }

        .bal-card button.v {
            border: 0;
            background: none;
        }

        .bal-card .v.inactive {
            color: rgba(255, 255, 255, 0.43);
            cursor: pointer;
            font-weight: 500;
            transition:
                color 150ms ease,
                transform 150ms ease;
        }

        .bal-card .v.inactive:hover {
            color: rgba(255, 255, 255, 0.72);
            transform: translateY(-1px);
        }

        .bal-card .v.inactive .bbadge {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.55);
        }

        .bal-card .sep {
            color: rgba(255, 255, 255, 0.28);
            font-size: 14px;
            font-weight: 400;
        }

        .bal-card .topup {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 34px;
            margin-top: 14px;
            gap: 8px;
            border: 0;
            border-radius: 66px;
            background: #f7f7f8;
            box-shadow:
                0 6px 18px rgba(0, 0, 0, 0.18),
                inset 0 1px 0 #fff;
            color: #0a0a0a;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition:
                transform 160ms ease,
                background 160ms ease,
                box-shadow 160ms ease;
        }

        .bal-card .topup:hover {
            background: #fff;
            box-shadow:
                0 8px 22px rgba(0, 0, 0, 0.22),
                inset 0 1px 0 #fff;
        }

        .bal-card .topup:active {
            transform: scale(0.97);
        }

        .bal-card .topup svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
        }

        .bal-card .topup svg circle {
            stroke-width: 1.8;
        }

        .bal-card .topup svg path {
            stroke-width: 2.6;
        }

        .menu-list {
            display: grid;
            margin-top: 4px;
        }

        .menu-item {
            display: flex;
            width: 100%;
            align-items: center;
            gap: 6px;
            padding: 4px 6px;
            border: 0;
            border-radius: 11px;
            background: transparent;
            color: #d0d1d4;
            cursor: pointer;
            text-align: left;
            text-decoration: none;
            transition:
                background 140ms ease,
                color 140ms ease;
            font-size: 13.5px;
            font-weight: 600;
            letter-spacing: -0.015em;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .menu-item .mi {
            display: grid;
            width: 30px;
            height: 30px;
            flex: none;
            place-items: center;
            color: #989a9e;
            transition: color 140ms ease;
        }

        .menu-item:hover .mi {
            color: currentColor;
        }

        .menu-item .mi i {
            font-size: 15px;
        }

        .menu-sep {
            height: 1px;
            margin: 8px;
            background: rgba(255, 255, 255, 0.055);
        }

        .menu-item.danger {
            color: #f06d72;
        }

        .menu-item.danger .mi {
            color: currentColor;
        }

        .menu-item.danger:hover {
            background: rgba(240, 109, 114, 0.07);
            color: #ff8186;
        }

        .variant-label {
            position: absolute;
            top: -24px;
            left: 0;
            color: rgba(255, 255, 255, 0.3);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .acc-menu {
            position: relative;
        }
    </style>
</head>

<body>

        <div class="acc-menu-user">
            <div class="acc-menu-av">U</div>

                <div class="acc-menu-name">Udodov</div>
                <div class="acc-menu-id">#638074 ✦</div>

        <div class="bal">

                variant-1 : Soft Glow (Мягкое свечение снизу)
                variant-2 : Emerald Mist (Изумрудный туман)

            <div class="bal-card variant-4" id="balCard8" data-account="rub">

                    <span class="star size-05" style="top:60%; right:18%; --base-opacity:0.4; --duration:4.5s; --delay:0.1s; --fall-y:18px; --drift-x:4px;"></span>

                    <span class="star size-05" style="top:70%; right:25%; --base-opacity:0.35; --duration:5.7s; --delay:0.3s; --fall-y:14px; --drift-x:7px;"></span>
                    <span class="star size-1"  style="top:55%; right:50%; --base-opacity:0.4; --duration:6.2s; --delay:0.8s; --fall-y:16px; --drift-x:-5px;"></span>
                    <span class="star size-05" style="top:80%; right:12%; --base-opacity:0.3; --duration:4.1s; --delay:0.5s; --fall-y:24px; --drift-x:10px;"></span>

                </div>

                <div class="sec">
                    <div class="krow">
                        <span class="k" id="accountLabel8">Основной счёт</span>
                        <div class="account-switch" role="group" aria-label="Выбор счёта">
                            <button class="account-btn active" type="button" data-account-button="rub" aria-label="Рублёвый счёт" aria-pressed="true" title="Рублёвый счёт">₽</button>

                        </div>

                        <span class="v main num" id="mainBalance8">466 ₽</span>

                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 8.5v7M8.5 12h7"></path></svg>

    <script>
        (() => {
            const accounts = {
                rub: {
                    label: "Основной счёт",
                    main: "466 ₽",
                    other: '110<span class="bbadge">Б</span>',
                    otherAccount: "bonus",
                    otherLabel: "Открыть бонусный счёт",
                    action: "Пополнить"
                },
                bonus: {
                    label: "Бонусный счёт",
                    main: '110<span class="bbadge">Б</span>',
                    other: "466 ₽",
                    otherAccount: "rub",
                    otherLabel: "Открыть рублёвый счёт",
                    action: "Ввести промокод"
                }
            };

            function initMenu(prefix) {
                const card = document.getElementById(prefix);
                const labelEl = card.parentElement.parentElement.querySelector('.k');
                const mainEl = card.querySelector('.v.main');
                const otherEl = card.querySelector('.v.inactive');
                const topupEl = card.querySelector('#topupLabel' + prefix.slice(-1));
                const buttons = card.closest('.acc-menu').querySelectorAll("[data-account-button]");

                function selectAccount(accountName) {
                    const account = accounts[accountName];
                    if (!account) return;

                    card.dataset.account = accountName;
                    labelEl.textContent = account.label;
                    mainEl.innerHTML = account.main;
                    otherEl.innerHTML = account.other;
                    otherEl.dataset.targetAccount = account.otherAccount;
                    otherEl.setAttribute("aria-label", account.otherLabel);
                    topupEl.textContent = account.action;

                    buttons.forEach((button) => {
                        const isActive = button.dataset.accountButton === accountName;
                        button.classList.toggle("active", isActive);
                        button.setAttribute("aria-pressed", String(isActive));
                    });
                }

                buttons.forEach((button) => {
                    button.addEventListener("click", () => {
                        selectAccount(button.dataset.accountButton);
                    });
                });

                otherEl.addEventListener("click", () => {
                    selectAccount(otherEl.dataset.targetAccount);
                });

                selectAccount("rub");
            }

            initMenu('balCard8');
        })();
    </script>
